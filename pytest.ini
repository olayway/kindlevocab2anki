[pytest]
# Import kindle_anki.py (repo root) as a top-level module.
pythonpath = .
# Real-LLM tests are marked `llm` and deselected by default so the suite is
# free and offline. Run them explicitly with:  pytest -m llm
markers =
    llm: hits the real Claude API (costs money); deselected by default
addopts = -m "not llm"
